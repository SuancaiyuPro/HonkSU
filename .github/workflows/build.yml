name: Build HonkSU

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test tests/domain.test.cjs
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 tools/check.py

  module:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      TARGET: aarch64-linux-android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned core revision
        id: core
        run: |
          python3 - <<'PY'
          import json, os
          meta=json.load(open('core.lock.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('repository='+meta['repository']+'\n')
              output.write('commit='+meta['commit']+'\n')
              output.write('features='+','.join(meta['features'])+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.core.outputs.repository }}
          ref: ${{ steps.core.outputs.commit }}
          path: .build/core
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=30
          sudo apt-get install -y cmake ninja-build pkg-config libclang-dev clang llvm zstd
      - name: Install pinned Rust and eBPF toolchains
        working-directory: .build/core
        shell: bash
        run: |
          set -euo pipefail
          rustup target add "$TARGET"
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("crates/honk-ebpf/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --component rust-src --component llvm-tools
          echo "HONKSU_EBPF_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - name: Install pinned bpf-linker
        shell: bash
        run: |
          set -euo pipefail
          source .build/core/.github/ci/pins.env
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bpf-linker.tar.zst" \
            "https://github.com/aya-rs/bpf-linker/releases/download/v$BPF_LINKER_VERSION/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          echo "$BPF_LINKER_SHA256  $RUNNER_TEMP/bpf-linker.tar.zst" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bpf-tools"
          zstd -dc "$RUNNER_TEMP/bpf-linker.tar.zst" | tar -xf - -C "$RUNNER_TEMP/bpf-tools"
          echo "$RUNNER_TEMP/bpf-tools" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bpf-tools/bpf-linker" --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: |
            .build/core -> target
            .build/core/crates/honk-ebpf -> target
          key: honksu-android-arm64-api35-ebpf
          cache-on-failure: true
      - name: Build BTF-bearing eBPF object before Android settings
        working-directory: .build/core/crates/honk-ebpf
        shell: bash
        run: |
          set -euo pipefail
          env -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS \
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/.build/core/crates/honk-ebpf/target" \
            cargo "+$HONKSU_EBPF_TOOLCHAIN" build --locked --release -Zbuild-std=core --target bpfel-unknown-none
          object=target/bpfel-unknown-none/release/honk-ebpf
          readelf -SW "$object" > "$RUNNER_TEMP/honksu-ebpf-sections.txt"
          grep -q '\.BTF ' "$RUNNER_TEMP/honksu-ebpf-sections.txt"
          printf '%s' "$HONKSU_EBPF_TOOLCHAIN" > "$object.toolchain"
      - name: Configure Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$TOOLCHAIN" >> "$GITHUB_PATH"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android35-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android35-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android35-clang" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=--target=aarch64-linux-android35 --sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot" >> "$GITHUB_ENV"
          echo "CMAKE_TOOLCHAIN_FILE_aarch64_linux_android=$GITHUB_WORKSPACE/.build/core/ci/android-toolchain.cmake" >> "$GITHUB_ENV"
          echo "BORING_BSSL_RUST_CPPLIB=c++_static" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C link-arg=-lc++abi -C link-arg=-Wl,-z,max-page-size=16384" >> "$GITHUB_ENV"
      - name: Build native honk core
        working-directory: .build/core
        run: cargo build --locked --release --target "$TARGET" -p honk-core --no-default-features --features "${{ steps.core.outputs.features }}"
      - name: Package KernelSU module
        run: python3 tools/package.py --core .build/core/target/aarch64-linux-android/release/honk-core --ebpf-object .build/core/crates/honk-ebpf/target/bpfel-unknown-none/release/honk-ebpf --out dist
      - name: Verify deliverable checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: HonkSU-arm64
          path: dist/
          if-no-files-found: error
